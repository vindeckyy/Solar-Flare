---
name: Bug Report
description: Create a bug report to help us improve.
body:
  - type: markdown
    attributes:
      value: >
        **THIS IS NOT THE PLACE TO ASK FOR SUPPORT!**
        Please use [GitHub Discussions](https://github.com/vindeckyy/Solar-Flare/discussions) for support issues.
        Non actionable bug reports will be LOCKED and CLOSED!
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
  - type: checkboxes
    attributes:
      label: Is your issue described in the documentation?
      description: Please read the [README](https://github.com/vindeckyy/Solar-Flare#readme)
      options:
        - label: I have read the documentation
  - type: dropdown
    attributes:
      label: Is your issue present in the latest release?
      description: Please test the latest [release](https://github.com/vindeckyy/Solar-Flare/releases).
      options:
        - "I have not tested the latest release"
        - "This issue is present in the latest release"
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: |
        Provide a clear description of the bug and list the steps to reproduce it.
        Include relevant log output and explain why the behavior is unexpected.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the bug here.
  - type: input
    id: solarflare-version
    attributes:
      label: SolarFlare version
      description: >
        Public release (for example v1.0.8) and/or build tag
        (for example v2026.728.1-solarflare). From `sunshine --version` or the
        Web UI home page.
      placeholder: v1.0.8 / v2026.728.1-solarflare
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Host Operating System
      description: >
        SolarFlare's maintained release profile is Linux x86-64. Other OS
        values are for inherited or experimental builds only.
      options:
        - Linux
        - Docker
        - FreeBSD
        - macOS
        - Windows
        - other, n/a
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Operating System Version
      description: Provide the version of the operating system. Additionally a build number would be helpful.
    validations:
      required: true
  - type: dropdown
    id: os-architecture
    attributes:
      label: Architecture
      options:
        - amd64/x86_64
        - arm64/aarch64
        - other, n/a
    validations:
      required: true
  - type: dropdown
    id: package_type
    attributes:
      label: Package
      description: How you installed this SolarFlare build
      options:
        - Linux - source installer (scripts/linux-install.sh)
        - Linux - release tarball (solarflare-linux-x86_64.tar.gz)
        - Linux - release binary (sunshine-x86_64)
        - Linux - manual cmake build
        - Linux - Docker (not a maintained SolarFlare image)
        - other (not listed)
        - other (self built)
        - n/a
    validations:
      required: true
  - type: dropdown
    id: graphics_type
    attributes:
      label: GPU Type
      description: The type of the installed graphics card.
      options:
        - AMD
        - Apple Silicon
        - Intel
        - NVIDIA
        - Qualcomm (mediafoundation)
        - none (software encoding)
        - n/a
    validations:
      required: true
  - type: input
    id: graphics_model
    attributes:
      label: GPU Model
      description: The model of the installed graphics card.
    validations:
      required: true
  - type: input
    id: graphics_driver
    attributes:
      label: GPU Driver/Mesa Version
      description: The driver/mesa version of the installed graphics card.
    validations:
      required: true
  - type: dropdown
    id: capture_method
    attributes:
      label: Capture Method
      description: The capture method being used.
      options:
        - AVCaptureScreen (macOS)
        - KMS (Linux)
        - NvFBC (Linux)
        - wlroots (FreeBSD/Linux)
        - X11 (FreeBSD/Linux)
        - XDG Portal Grab (FreeBSD/Linux)
        - Desktop Duplication API (Windows)
        - Windows.Graphics.Capture (Windows)
    validations:
      required: false
  - type: textarea
    id: apps
    attributes:
      label: Apps
      description: |
        If this is an issue with launching a game or app, please copy and paste your `apps.json` file.
      render: json
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: |
        Copy and paste logs from web-ui troubleshooting page.
        This will be automatically formatted into code, so no need for backticks.
        :warning: If full logs are not provided, the issue will be closed! :warning:
      render: shell
    validations:
      required: false
  - type: input
    id: logs_link
    attributes:
      label: Online logs
      description: |
        If logs are too long to include in the field above,
        create a [gist](https://gist.github.com/) of the logs and paste the link here.
    validations:
      required: false
