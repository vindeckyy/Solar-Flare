---
# SolarFlare fork override.
# Upstream runs CodeQL via LizardByte/.github/... which is unreachable from this fork.
# Every push/PR/schedule run on the fork would fail. Disabled.

name: "CodeQL (no-op on fork)"
permissions: {}

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '00 12 * * 0'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  noop:
    name: "CodeQL (no-op on fork)"
    runs-on: ubuntu-latest
    steps:
      - name: No-op (fork)
        run: echo "CodeQL disabled on vindeckyy/Solar-Flare fork. Upstream calls LizardByte/.github/."
