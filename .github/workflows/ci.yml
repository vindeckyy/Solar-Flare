---
name: CI
permissions: {}

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# SolarFlare is maintained as a Linux-focused fork. The upstream Sunshine
# workflow depends on LizardByte-only release setup, secrets, and publishing
# jobs; those dependencies caused every job in this repository to be skipped.
# Keep the fork's default CI small and useful: verify the web bundle, then run
# the Linux build and test suite. Release packaging remains in release.yml.
jobs:
  web:
    name: Web bundle
    permissions:
      contents: read
    uses: ./.github/workflows/ci-bundle.yml

  linux:
    name: Linux build and tests
    permissions:
      contents: read
    uses: ./.github/workflows/ci-linux.yml
    with:
      release_commit: ${{ github.sha }}
      release_version: 0.0.0-ci
