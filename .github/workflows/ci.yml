---
# SolarFlare fork override for the centrally-managed ci.yml.
#
# The upstream ci.yml calls LizardByte/.github/.github/workflows/... and
# gates every job on `startsWith(github.repository, 'LizardByte/')`. On
# this fork the owner is 'vindeckyy', so every job skips and the
# workflow's `release` and `coverage` jobs (which `needs:` the skipped
# matrix) fail with "No jobs were skipped but the 'needs' set was
# satisfied by skipped jobs" — exactly the failure mode the v2026.708.4
# release commit (a30c8f1) hit.
#
# The fork has its own release pipeline in release.yml (Linux CachyOS,
# macOS x86_64+arm64, Windows x86_64 → per-platform binaries uploaded
# to the matching GitHub release). ci.yml is not used on this fork.
#
# We replace ci.yml with a no-op workflow so the Actions tab stays
# clean. The release pipeline runs on tag push (see release.yml).
#
# If LizardByte ever publishes a fork-friendly ci.yml, this override
# should be deleted and the upstream file restored via
# `git checkout lizardbyte-upstream/master -- .github/workflows/ci.yml`.

name: "CI (no-op on fork)"
permissions: {}

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  noop:
    name: "CI (no-op on fork)"
    runs-on: ubuntu-latest
    steps:
      - name: No-op (fork)
        run: |
          echo "SolarFlare fork does not run upstream ci.yml."
          echo "Reason: Every job is gated on 'startsWith(repository, LizardByte/)' (owner 'vindeckyy')."
          echo "The fork builds + publishes binaries from release.yml instead."
          echo "Owner: ${{ github.repository_owner }} (expected 'LizardByte')."
          echo "This workflow is intentionally disabled. See the file's header comment."
