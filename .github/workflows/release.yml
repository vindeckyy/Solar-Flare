---
name: release

# Linux-only SolarFlare release pipeline.
#
# Tag convention: v<YYYY>.<MDD>.<N>-solarflare
# Release title: SolarFlare <YYYY>.<MDD>.<N>
#
# A tag push builds and verifies every artifact first. The GitHub release is
# created only after the executable, runtime bundle, and packaged logo assets
# pass validation.

on:
  push:
    tags:
      - 'v*-solarflare'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v2026.726.1-solarflare)'
        required: true
        default: 'v2026.726.1-solarflare'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build_linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            libssl-dev libcurl4-openssl-dev libpulse-dev libdrm-dev libva-dev \
            libx11-dev libxfixes-dev libxrandr-dev libxcb1-dev libxkbcommon-dev \
            libevdev-dev libopus-dev ffmpeg \
            libpipewire-0.3-dev libportal-dev \
            libwayland-dev wayland-protocols \
            libudev-dev libcap-dev libnatpmp-dev \
            glslang-tools spirv-tools \
            libboost-all-dev libminiupnpc-dev nlohmann-json3-dev \
            libpng-dev libxext-dev libxtst-dev nodejs npm
          npm ci --no-audit --no-fund

      - name: Configure
        run: |
          cmake -B cmake-build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_DOCS=OFF \
            -DBUILD_TESTS=OFF \
            -DSUNSHINE_ENABLE_TRAY=OFF \
            -DSUNSHINE_ENABLE_CUDA=OFF \
            -DCUDA_FAIL_ON_MISSING=OFF \
            -DFFMPEG_PREBUILT=ON \
            -DSUNSHINE_ASSETS_DIR=./assets

      - name: Build
        run: cmake --build cmake-build-release -j2

      - name: Stage Linux artifacts
        run: |
          install -m 0755 cmake-build-release/sunshine sunshine-x86_64
          strip sunshine-x86_64
          mkdir -p stage/solarflare
          install -m 0755 sunshine-x86_64 stage/solarflare/sunshine
          cp -r cmake-build-release/assets stage/solarflare/assets
          install -m 0644 sunshine.svg stage/solarflare/sunshine.svg
          install -m 0644 LICENSE stage/solarflare/LICENSE
          tar -C stage -czf solarflare-linux-x86_64.tar.gz solarflare

      - name: Verify binary and packaged logos
        run: |
          set -euo pipefail
          ./sunshine-x86_64 --version | tee version.txt
          grep -q 'SolarFlare' version.txt
          ! ldd sunshine-x86_64 | grep -q 'not found'
          cmp sunshine.svg cmake-build-release/assets/web/images/solarflare-mark.svg
          cmp sunshine.ico cmake-build-release/assets/web/images/sunshine.ico
          tar -xOf solarflare-linux-x86_64.tar.gz \
            solarflare/assets/web/images/solarflare-mark.svg | cmp - sunshine.svg
          tar -xOf solarflare-linux-x86_64.tar.gz \
            solarflare/assets/web/images/sunshine.ico | cmp - sunshine.ico
          tar -xOf solarflare-linux-x86_64.tar.gz \
            solarflare/sunshine.svg | cmp - sunshine.svg

      - name: Upload verified workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-linux-x86_64
          path: |
            sunshine-x86_64
            solarflare-linux-x86_64.tar.gz
          if-no-files-found: error

  publish_release:
    name: Publish verified Linux release
    needs: build_linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release sources
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-linux-x86_64
          path: artifacts

      - name: Final release gate
        run: |
          set -euo pipefail
          test -s artifacts/sunshine-x86_64
          test -s artifacts/solarflare-linux-x86_64.tar.gz
          tar -xOf artifacts/solarflare-linux-x86_64.tar.gz \
            solarflare/assets/web/images/solarflare-mark.svg | cmp - sunshine.svg
          tar -xOf artifacts/solarflare-linux-x86_64.tar.gz \
            solarflare/assets/web/images/sunshine.ico | cmp - sunshine.ico
          (cd artifacts && sha256sum sunshine-x86_64 solarflare-linux-x86_64.tar.gz > SHA256SUMS)
          release_version="${RELEASE_TAG#v}"
          release_version="${release_version%-solarflare}"
          echo "RELEASE_NAME=SolarFlare ${release_version}" >> "$GITHUB_ENV"

      - name: Create release and upload Linux binaries
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: |
            artifacts/sunshine-x86_64
            artifacts/solarflare-linux-x86_64.tar.gz
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
