---
# SolarFlare fork override.
# Upstream calls LizardByte/.github/... which is unreachable from this fork.
# Every PR on the fork would fail. Disabled.

name: "common lint (no-op on fork)"
permissions: {}

on:
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  noop:
    name: "common lint (no-op on fork)"
    runs-on: ubuntu-latest
    steps:
      - name: No-op (fork)
        run: echo "common lint disabled on vindeckyy/Solar-Flare fork. Upstream calls LizardByte/.github/."
