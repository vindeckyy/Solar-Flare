---
# SolarFlare fork override.
# Upstream calls LizardByte/LizardByte.github.io/... which is unreachable from this fork.
# Every push/PR on the fork would fail. Disabled.

name: "GH-Pages (no-op on fork)"
permissions: {}

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  noop:
    name: "GH-Pages (no-op on fork)"
    runs-on: ubuntu-latest
    steps:
      - name: No-op (fork)
        run: echo "GH-Pages disabled on vindeckyy/Solar-Flare fork. Upstream calls LizardByte/LizardByte.github.io/."
