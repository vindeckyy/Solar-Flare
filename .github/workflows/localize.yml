---
# SolarFlare fork override.
# Upstream calls LizardByte/lizardbyte-common/... which is unreachable from this fork.
# Every push to master on the fork would fail. Disabled.

name: "localize (no-op on fork)"
permissions: {}

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/localize.yml'
      - 'src/**'
      - 'locale/sunshine.po'
  workflow_dispatch:

jobs:
  noop:
    name: "localize (no-op on fork)"
    runs-on: ubuntu-latest
    steps:
      - name: No-op (fork)
        run: echo "localize disabled on vindeckyy/Solar-Flare fork. Upstream calls LizardByte/lizardbyte-common/."
