<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <%- header %>
</head>

<body id="app" v-cloak>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card">
          <div class="card-body text-center">
            <img src="/images/solarflare-mark.svg" height="45" alt="SolarFlare" class="mb-3 solarflare-logo">
            <h1 class="h3 mb-3">{{ $t('logout.logged_out') }}</h1>
            <p class="text-muted mb-4">{{ $t('logout.logged_out_desc') }}</p>
            <button type="button" class="btn btn-primary" @click="login">
              <log-in :size="18" class="icon"></log-in>
              {{ $t('logout.login') }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
<script type="module">
  import { createApp } from 'vue'
  import { initApp } from './init'
  import { loadAutoTheme } from './theme'
  import { LogIn } from '@lucide/vue'

  loadAutoTheme();

  const app = createApp({
    components: {
      LogIn,
    },
    methods: {
      /**
       * @brief Force a fresh HTTP Basic Auth prompt, then enter the host UI.
       *
       * A plain link to `/` often does nothing after a cancelled or failed
       * login because the browser already decided not to send credentials.
       * Clear that sticky Basic Auth state the same way Navbar logout does,
       * then navigate home so the browser prompts again.
       */
      login() {
        const homeUrl = new URL('/', globalThis.location.href)
        const request = new XMLHttpRequest()
        const finish = () => {
          globalThis.location.replace(homeUrl.toString())
        }

        request.open('GET', '/', true, 'sunshine-logout', Date.now().toString())
        request.setRequestHeader('Cache-Control', 'no-store')
        request.onload = finish
        request.onerror = finish
        request.ontimeout = finish
        request.timeout = 5000
        request.send()
      },
    },
  });

  initApp(app);
</script>

</html>
