<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <%- header %>
</head>

<body id="app" v-cloak>
  <Navbar></Navbar>
  <main id="content" class="container">
    <header class="my-4 text-center">
      <h1>{{ $t('pin.pin_pairing') }}</h1>
    </header>
    <form class="form d-flex flex-column align-items-center" id="form" @submit.prevent="registerDevice" aria-label="Pair device">
      <div class="card flex-column d-flex p-4 mb-4" role="group" aria-labelledby="pin-heading">
        <h2 id="pin-heading" class="visually-hidden">{{ $t('pin.pin_pairing') }}</h2>
        <div class="input-group mt-2">
          <label class="input-group-text" for="pin-input" aria-hidden="true">
            <hash :size="18" class="icon" aria-hidden="true"></hash>
          </label>
          <input type="text" pattern="\d*" inputmode="numeric" :placeholder="`${$t('navbar.pin')}`" :aria-label="$t('navbar.pin')" autofocus id="pin-input" class="form-control" required autocomplete="one-time-code" />
        </div>
        <div class="input-group my-4">
          <label class="input-group-text" for="name-input" aria-hidden="true">
            <monitor :size="18" class="icon" aria-hidden="true"></monitor>
          </label>
          <input type="text" :placeholder="`${$t('pin.device_name')}`" :aria-label="$t('pin.device_name')" id="name-input" class="form-control" required autocomplete="nickname" />
        </div>
        <button class="btn btn-primary" type="submit">
          <forward :size="18" class="icon" aria-hidden="true"></forward>
          {{ $t('pin.send') }}
        </button>
      </div>
      <div class="alert alert-warning" role="alert">
        <b>{{ $t('_common.warning') }}</b> {{ $t('pin.warning_msg') }}
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>
</body>

<script type="module">
  import { createApp } from 'vue'
  import { initApp } from './init'
  import Navbar from './Navbar.vue'
  import { apiFetch } from './fetch_utils'
  import {
    Forward,
    Hash,
    Monitor,
  } from '@lucide/vue'

  let app = createApp({
    components: {
      Navbar,
      Forward,
      Hash,
      Monitor,
    },
    inject: ['i18n'],
    methods: {
      registerDevice(e) {
        let pin = document.querySelector("#pin-input").value;
        let name = document.querySelector("#name-input").value;
        document.querySelector("#status").innerHTML = "";
        let b = JSON.stringify({pin: pin, name: name});
        apiFetch("./api/pin", {
          method: "POST",
          headers: {
            'Content-Type': 'application/json'
          },
          body: b
        })
          .then((response) => response.json())
          .then((response) => {
            if (response.status === true) {
              document.querySelector(
                "#status"
              ).innerHTML = `<div class="alert alert-success" role="alert">${this.i18n.t('pin.pair_success')}</div>`;
              document.querySelector("#pin-input").value = "";
              document.querySelector("#name-input").value = "";
            } else {
              document.querySelector(
                "#status"
              ).innerHTML = `<div class="alert alert-danger" role="alert">${this.i18n.t('pin.pair_failure')}</div>`;
            }
          });
      }
    }
  });

  initApp(app);
</script>
